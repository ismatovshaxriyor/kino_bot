# KinoBot — to'liq Docker tarkibi (Redis + Postgres + bot + worker).
#
# Lokal ishlab chiqish:
#   docker compose up -d                          -> faqat redis + db
#   (bot/worker'ni host'da `python main.py` / `python worker.py` bilan ishlating)
#
# Production (EC2):
#   docker compose --profile app up -d --build    -> hammasi (4 ta konteyner)
#
# bot/worker "app" profilida — profil ko'rsatilmasa ishga tushmaydi, shu sababli
# bitta fayl ham lokal dev, ham production uchun ishlaydi.
#
# Redis/Postgres portlari faqat 127.0.0.1 ga ochilgan: internetdan yopiq,
# lekin host'dan (yoki SSH tunnel orqali) psql/redis-cli bilan kirish mumkin.

services:
  redis:
    image: redis:alpine
    container_name: my_bot_redis
    restart: always
    # maxmemory: kesh kalitlari (TTL bor) tugasa eng eskisi o'chadi; TTL'siz navbat (bot_queue) hech qachon o'chmaydi
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15-alpine
    container_name: my_bot_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    image: kino_bot:latest
    container_name: my_bot_app
    profiles: ["app"]
    restart: always
    command: python main.py
    env_file: .env
    environment:
      # Konteyner ichidan infra compose tarmog'i orqali ko'rinadi —
      # .env'dagi DB_HOST/REDIS_URL qiymatlarini bekor qiladi.
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis
    volumes:
      # aerich migratsiyalari host'da saqlanib qolishi uchun (.gitignore'da)
      - ./migrations:/app/migrations
      # /shutdown (yakuniy to'xtatish): asl .env ni adminga yuborish uchun (faqat o'qish) va qulf fayli uchun
      - ./.env:/run/kino/.env:ro
      - ./state:/state
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    image: kino_bot:latest
    container_name: my_bot_worker
    profiles: ["app"]
    restart: always
    command: python worker.py
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis
    volumes:
      - ./state:/state   # yakuniy to'xtatish qulfi (utils/shutdown_guard.py)
    depends_on:
      redis:
        condition: service_healthy

  # ---- Admin paneli (Telegram Mini App): docs/WEBAPP.md ----
  # Docker API'ga faqat o'qish: docker-socket-proxy faqat GET /containers/* ga ruxsat beradi.
  # Port faqat 127.0.0.1 da — panel (host tarmog'ida) shu orqali ulanadi.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: my_bot_dockerproxy
    profiles: ["app"]
    restart: always
    environment:
      CONTAINERS: "1"
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # network_mode: host — /proc/net/dev serverning haqiqiy tarmoq trafigini ko'rsatishi uchun.
  # Faqat 127.0.0.1:8787 da tinglaydi; internetga faqat ngrok orqali chiqadi.
  webapp:
    build: .
    image: kino_bot:latest
    container_name: my_bot_webapp
    profiles: ["app"]
    restart: always
    command: python -m webapp
    network_mode: host
    env_file: .env
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: ${DB_PORT}
      REDIS_URL: redis://127.0.0.1
      WEBAPP_HOST: 127.0.0.1
      WEBAPP_PORT: "8787"
      DOCKER_API_URL: http://127.0.0.1:2375
      NGROK_API_URL: http://127.0.0.1:4040
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      dockerproxy:
        condition: service_started

  # Bepul tarifda havola ngrok qayta ishga tushganda o'zgaradi — webapp uni avtomatik botga ulaydi.
  # Token: `bash scripts/set_ngrok_token.sh` (NGROK_AUTHTOKEN .env ga yoziladi). Doimiy domen bo'lsa:
  # .env ga NGROK_EXTRA=--url=nomi.ngrok-free.app
  ngrok:
    image: ngrok/ngrok:3-alpine
    container_name: my_bot_ngrok
    profiles: ["app"]
    restart: always
    network_mode: host
    command: http 127.0.0.1:8787 --log=stdout --traffic-policy-file=/etc/ngrok/policy.yml ${NGROK_EXTRA:-}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    volumes:
      - ./webapp/ngrok_policy.yml:/etc/ngrok/policy.yml:ro   # ngrok ogohlantirish sahifasini o'chiradi

volumes:
  redis_data:
  pg_data:
